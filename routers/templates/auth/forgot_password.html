<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password – Churchgate</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border p-8">
    <h1 class="text-xl font-bold text-slate-900 mb-1">Reset password</h1>
    <p class="text-sm text-slate-500 mb-6">After several failed logins, wait 2 minutes, then set a new strong password here.</p>
    {% if error %}<div class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm">{{ error }}</div>{% endif %}
    {% if success %}<div class="mb-4 p-3 rounded-lg bg-emerald-50 text-emerald-800 text-sm">{{ success }}</div>{% endif %}
    <form method="post" action="/auth/forgot-password" class="space-y-4">
      <input type="email" name="email" required placeholder="Account email" class="w-full px-4 py-3 rounded-lg border">
      <input type="password" name="new_password" required minlength="8" placeholder="New strong password" class="w-full px-4 py-3 rounded-lg border">
      <input type="password" name="confirm_password" required minlength="8" placeholder="Confirm password" class="w-full px-4 py-3 rounded-lg border">
      <input type="tel" name="phone" placeholder="Phone / WhatsApp for confirmation" class="w-full px-4 py-3 rounded-lg border">
      <button class="w-full py-3 rounded-lg bg-slate-900 text-white font-semibold">Update password</button>
    </form>
    <a href="/auth/login" class="block text-center text-sm text-blue-700 font-semibold mt-6">← Back to sign in</a>
  </div>
</body>
</html>
