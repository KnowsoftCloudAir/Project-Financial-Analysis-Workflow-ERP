{% extends "base.html" %}
{% block title %}Commodity transfer{% endblock %}
{% block content %}
<div class="container py-3" style="max-width:720px">
  <h2>Commodity transfer form</h2>
  <p class="text-muted">Transfer between service units or back to Main Warehouse. Requires PM/Admin approval before stock moves are finalised and certificates issued.</p>
  <form method="post" class="card card-body shadow-sm">
    <div class="mb-3"><label class="form-label">From facility</label>
      <select name="from_facility_id" class="form-select" required>
        <option value="">Select</option>{% for f in facilities %}<option value="{{ f.id }}">{{ f.name }}</option>{% endfor %}
      </select></div>
    <div class="mb-3"><label class="form-label">To facility</label>
      <select name="to_facility_id" class="form-select" required>
        <option value="">Select</option>{% for f in facilities %}<option value="{{ f.id }}">{{ f.name }}</option>{% endfor %}
      </select></div>
    <div class="mb-3"><label class="form-label">Commodity</label>
      <select name="product_id" class="form-select" required>
        <option value="">Select</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select></div>
    <div class="mb-3"><label class="form-label">Quantity</label>
      <input class="form-control" name="quantity" type="number" step="0.01" min="0.01" required></div>
    <div class="mb-3"><label class="form-label">Notes</label>
      <textarea class="form-control" name="notes" rows="2"></textarea></div>
    <button class="btn btn-primary">Submit for approval</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('logistics.uptake_home') }}">Back</a>
  </form>
</div>
{% endblock %}
