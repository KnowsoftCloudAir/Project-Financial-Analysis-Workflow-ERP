<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quotation submitted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:720px">
  <div class="card card-body">
    <h3>Your quotation has been submitted successfully.</h3>
    <p>{{ invite.vendor_name }}, your quote for {{ event.ref_no }} — {{ event.title }} is on file. Keep this link to view status after evaluation.</p>
    <a class="btn btn-primary" href="{{ url_for('ops.vendor_ref', token=invite.token) }}">Back to status</a>
  </div>
</div>
</body>
</html>
