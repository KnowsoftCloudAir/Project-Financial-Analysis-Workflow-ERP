{% extends "base.html" %}
{% block title %}Set new password – CONTRAconnect{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Set a new password</h1>
      <p class="text-muted small mb-4">
        Enter the email, the <strong>6-digit code</strong> from your email, and your new password
        (Churchgate-style reset).
      </p>

      <form method="post" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email"
                 value="{{ email or '' }}" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="code">Reset code</label>
          <input type="text" class="form-control" id="code" name="code"
                 value="{{ code or '' }}" required inputmode="numeric"
                 pattern="[0-9A-Za-z\-_]{4,64}" autocomplete="one-time-code"
                 placeholder="6-digit code from email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">New password</label>
          <input type="password" class="form-control" id="password" name="password"
                 required minlength="8" autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm_password">Repeat new password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                 required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-success w-100" style="background:#0d9488;border-color:#0d9488">
          Reset password
        </button>
      </form>

      <hr class="my-4">
      <p class="small mb-0 text-center">
        <a href="{{ url_for('forgot_password') }}">Request a new code</a>
        · <a href="{{ url_for('login') }}">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
