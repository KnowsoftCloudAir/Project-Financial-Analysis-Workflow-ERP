{% extends "base.html" %}
{% block title %}Quotation submitted{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width:560px">
  <div class="card shadow border-success">
    <div class="card-body py-5">
      <h3 class="text-success mb-3">Thank you</h3>
      <p>Your quotation has been submitted.</p>
      <p>Special number: <code class="fs-5">{{ special }}</code></p>
      <p class="mb-0">Total amount: <strong>{{ '%.2f'|format(total) }}</strong></p>
    </div>
  </div>
</div>
{% endblock %}
