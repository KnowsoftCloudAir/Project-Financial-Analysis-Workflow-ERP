{% extends "base.html" %}
{% block title %}New RFQ{% endblock %}
{% block content %}
<div class="container py-3" style="max-width:720px">
  <h3>New RFQ / LTA</h3>
  <form method="post" class="card card-body">
    <div class="mb-2"><label class="form-label">RFQ No. (optional)</label><input name="rfq_no" class="form-control" placeholder="Auto if blank"></div>
    <div class="mb-2"><label class="form-label">Title *</label><input name="title" class="form-control" required></div>
    <div class="mb-2"><label class="form-label">Lot</label>
      <select name="lot" class="form-select">
        <option value="Lot 1 FP Commodities">Lot 1 FP Commodities</option>
        <option value="Lot 2 Medical Consumables">Lot 2 Medical Consumables</option>
        <option value="">Other</option>
      </select>
    </div>
    <div class="mb-2"><label class="form-label">Min shelf-life (months)</label><input name="min_shelf_life_months" type="number" class="form-control" value="6"></div>
    <div class="mb-2"><label class="form-label">Technical specs</label><textarea name="technical_specs" class="form-control" rows="4"></textarea></div>
    <div class="mb-2"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
    <button class="btn btn-primary">Create</button>
    <a href="{{ url_for('erp.rfqs_list') }}" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
