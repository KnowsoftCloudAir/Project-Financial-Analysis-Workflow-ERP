{% extends "base.html" %}
{% block title %}Choose facility{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <h3>Facilities</h3>
  {% for f in facilities %}
    <a class="list-group-item list-group-item-action" href="{{ url_for('ops.facility_board', fid=f.id) }}">{{ f.name }}</a>
  {% endfor %}
</div>
{% endblock %}
