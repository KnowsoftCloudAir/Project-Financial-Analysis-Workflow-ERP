{% extends "base.html" %}
{% block title %}Raise RFQ{% endblock %}
{% block content %}
<div class="container-fluid py-3 wrap-page">
  <h3>Raise RFQ</h3>
  <p class="text-muted">Minimum 4 items, maximum 20. All fields, the terms of reference PDF, and a reviewer are required.</p>
  <form method="post" enctype="multipart/form-data" class="card card-body" id="rfqForm">
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label">Lot</label><select class="form-select" name="lot"><option>Lot 1 FP commodities</option><option>Lot 2 medical consumables</option></select></div>
      <div class="col-md-8"><label class="form-label">Title</label><input class="form-control" name="title" required></div>
      <div class="col-md-6"><label class="form-label">Closing date</label><input class="form-control" type="datetime-local" name="closing_at" required></div>
      <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" required></textarea></div>
      <div class="col-12"><label class="form-label">How the service must be provided</label><textarea class="form-control" name="service_terms" required></textarea></div>
      <div class="col-md-4"><label class="form-label">Project code</label>
        <select class="form-select" name="project_id" required>{% for p in projects %}<option value="{{ p.id }}">{{ p.code }} — {{ p.name }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Expense code</label>
        <select class="form-select" name="expense_code_id" required>{% for e in expenses %}<option value="{{ e.id }}">{{ e.code }} — {{ e.description }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Budget code funding the items</label>
        <select class="form-select" name="budget_code_id" required>{% for b in budgets %}<option value="{{ b.id }}">{{ b.code }} — {{ b.description }}</option>{% endfor %}</select></div>
      <div class="col-md-6"><label class="form-label">Reviewer</label>
        <select class="form-select" name="reviewer_id" required>{% for s in staff %}<option value="{{ s.id }}">{{ s.full_name }} ({{ s.role }})</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Debit account</label><select class="form-select" name="debit_account_id" required><option value="">Select debit</option>{% for a in codebook.accounts %}<option value="{{ a.id }}">{{ a.code }} — {{ a.name }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Credit account</label><select class="form-select" name="credit_account_id" required><option value="">Select credit</option>{% for a in codebook.accounts %}<option value="{{ a.id }}">{{ a.code }} — {{ a.name }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Terms of reference (PDF)</label><input class="form-control" type="file" name="tor" accept="application/pdf" required></div>
    </div>
    <h5 class="mt-4">Items and quantity</h5>
    <div id="items">
      {% for n in range(1,5) %}
      <div class="row g-2 mb-2 item-row">
        <div class="col-md-6"><input class="form-control" name="item_desc" placeholder="Item {{ n }}" required></div>
        <div class="col-md-3"><input class="form-control" name="item_qty" type="number" min="0.01" step="0.01" placeholder="Quantity" required></div>
        <div class="col-md-3"><input class="form-control" name="item_unit" placeholder="Unit" value="unit"></div>
      </div>
      {% endfor %}
    </div>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="addItem">Add item</button>
    <div class="mt-3"><button class="btn btn-primary">Create RFQ and send for review</button></div>
  </form>
</div>
<script>
document.getElementById('addItem').addEventListener('click', function () {
  const box = document.getElementById('items');
  if (box.querySelectorAll('.item-row').length >= 20) return;
  const row = document.createElement('div');
  row.className = 'row g-2 mb-2 item-row';
  row.innerHTML = '<div class="col-md-6"><input class="form-control" name="item_desc" placeholder="Item" required></div><div class="col-md-3"><input class="form-control" name="item_qty" type="number" min="0.01" step="0.01" placeholder="Quantity" required></div><div class="col-md-3"><input class="form-control" name="item_unit" placeholder="Unit" value="unit"></div>';
  box.appendChild(row);
});
</script>
{% endblock %}
