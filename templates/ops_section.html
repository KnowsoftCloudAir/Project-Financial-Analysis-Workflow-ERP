{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <h3>{{ title }}</h3>
  <p class="text-muted">{{ intro }}</p>
  <div class="list-group col-lg-8">
    {% for label, endpoint in links %}
      <a class="list-group-item list-group-item-action" href="{{ url_for(endpoint) }}">{{ label }}</a>
    {% endfor %}
  </div>
</div>
{% endblock %}
