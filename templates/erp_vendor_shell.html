<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vendor portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7f7; min-height: 100vh; }
    .v-header {
      background: linear-gradient(135deg, #0d6e6e, #0a4f4f);
      color: #fff; padding: 1rem 1.25rem;
    }
  </style>
</head>
<body>
  <div class="v-header">
    <div class="container" style="max-width:860px">
      <div class="small opacity-75">Project Financial Management Workflow · Vendor portal</div>
      <div class="fw-semibold">{% block header %}Quotation{% endblock %}</div>
    </div>
  </div>
  <div class="container py-4" style="max-width:860px">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat if cat != 'message' else 'info' }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
