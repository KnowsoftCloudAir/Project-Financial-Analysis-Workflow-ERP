<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Something went wrong" }} — Churchgate</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen relative">
  <div class="fixed inset-0 bg-cover bg-center" style="background-image:url('https://images.unsplash.com/photo-1438032005730-c779502df39b?auto=format&fit=crop&w=1600&q=80');"></div>
  <div class="fixed inset-0 bg-slate-900/55"></div>
  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full text-center bg-white/95 backdrop-blur border border-white/40 rounded-3xl shadow-2xl p-8">
      <div class="text-5xl mb-3">⛪</div>
      <h1 class="text-xl font-bold text-slate-900 mb-2">{{ title or "Something went wrong" }}</h1>
      <p class="text-sm text-slate-600 mb-6 leading-relaxed">{{ message or "We could not complete that request. You can go back or return home." }}</p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button type="button" onclick="if (history.length > 1) { history.back(); } else { location.href='/'; }"
                class="px-5 py-3 rounded-xl bg-slate-900 text-white text-sm font-semibold shadow">
          ← Back to previous page
        </button>
        <a href="/" class="px-5 py-3 rounded-xl bg-teal-600 text-white text-sm font-semibold shadow">
          Home page
        </a>
      </div>
      <a href="/auth/login" class="inline-block mt-4 text-xs text-teal-800 font-medium underline">Sign in</a>
    </div>
  </div>
</body>
</html>
