{% extends "base.html" %}
{% block title %}Purchase Orders{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between mb-3">
    <h3>Purchase Orders</h3>
    <a href="{{ url_for('erp.erp_home') }}" class="btn btn-outline-secondary btn-sm">ERP Home</a>
  </div>
  <div class="card"><table class="table mb-0">
    <thead><tr><th>PO No.</th><th>Vendor</th><th>Amount</th><th>Status</th></tr></thead>
    <tbody>
    {% for p in pos %}
      <tr>
        <td><a href="{{ url_for('erp.po_detail', poid=p.id) }}">{{ p.po_no }}</a></td>
        <td>{{ p.vendor_name }}</td>
        <td>{{ '{:,.0f}'.format(p.amount or 0) }}</td>
        <td>{{ p.status }}</td>
      </tr>
    {% else %}<tr><td colspan="4" class="text-muted">None</td></tr>{% endfor %}
    </tbody>
  </table></div>
</div>
{% endblock %}
