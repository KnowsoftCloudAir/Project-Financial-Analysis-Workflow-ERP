{% macro coding_fields(selected) %}
<div class="row g-2">
  <div class="col-md-4"><label class="form-label">Project code</label>
    <select class="form-select" name="project_id" required>
      <option value="">Select project</option>
      {% for p in codebook.projects %}<option value="{{ p.id }}" {% if selected and selected.project_id == p.id %}selected{% endif %}>{{ p.code }} — {{ p.name }}</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Expense code</label>
    <select class="form-select" name="expense_code_id" required>
      <option value="">Select expense code</option>
      {% for e in codebook.expenses %}<option value="{{ e.id }}" {% if selected and selected.expense_code_id == e.id %}selected{% endif %}>{{ e.code }} — {{ e.description }}</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Budget code</label>
    <select class="form-select" name="budget_code_id" required>
      <option value="">Select budget code</option>
      {% for b in codebook.budgets %}<option value="{{ b.id }}" {% if selected and selected.budget_code_id == b.id %}selected{% endif %}>{{ b.code }} — {{ b.description }}</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Debit account</label>
    <select class="form-select" name="debit_account_id" required>
      <option value="">Select debit</option>
      {% for a in codebook.accounts %}<option value="{{ a.id }}" {% if selected and selected.debit_account_id == a.id %}selected{% endif %}>{{ a.code }} — {{ a.name }} ({{ a.account_type }})</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Credit account</label>
    <select class="form-select" name="credit_account_id" required>
      <option value="">Select credit</option>
      {% for a in codebook.accounts %}<option value="{{ a.id }}" {% if selected and selected.credit_account_id == a.id %}selected{% endif %}>{{ a.code }} — {{ a.name }} ({{ a.account_type }})</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Payable account (part payment)</label>
    <select class="form-select" name="payable_account_id">
      <option value="">Not used for full payment</option>
      {% for a in codebook.accounts %}<option value="{{ a.id }}" {% if selected and selected.payable_account_id == a.id %}selected{% endif %}>{{ a.code }} — {{ a.name }}</option>{% endfor %}
    </select></div>
  <div class="col-md-3"><label class="form-label">Payment</label>
    <select class="form-select" name="pay_mode"><option value="full">Full</option><option value="part" {% if selected and selected.pay_mode == 'part' %}selected{% endif %}>Part</option></select></div>
  <div class="col-md-3"><label class="form-label">Cash amount if part</label>
    <input class="form-control" name="pay_amount" value="{{ selected.pay_amount if selected else '' }}"></div>
</div>
{% endmacro %}
