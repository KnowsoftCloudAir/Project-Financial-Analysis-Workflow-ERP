{% extends "public_base.html" %}
{% block title %}Quotation submitted{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="max-width:560px">
  <div class="card border-0 shadow-sm p-4">
    <div class="display-6 text-success mb-2"><i class="bi bi-check-circle"></i></div>
    <h3>Submitted</h3>
    <p class="text-muted">{{ message }}</p>
    <p class="fw-semibold">Reference: {{ code }}</p>
    <p class="small text-muted">RFQ {{ rfq.rfq_no }} — {{ rfq.title }}</p>
  </div>
</div>
{% endblock %}
