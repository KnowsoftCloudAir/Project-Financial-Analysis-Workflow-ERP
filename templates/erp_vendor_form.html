{% extends "base.html" %}
{% block title %}Register Vendor{% endblock %}
{% block content %}
<div class="container py-3" style="max-width:640px">
  <h3>Register Vendor</h3>
  <form method="post" class="card card-body">
    <div class="mb-2"><label class="form-label">Name *</label><input name="name" class="form-control" required></div>
    <div class="mb-2"><label class="form-label">Vendor number</label><input name="vendor_number" class="form-control" placeholder="Auto"></div>
    <div class="mb-2"><label class="form-label">Experience (years)</label><input name="experience_years" type="number" class="form-control" value="3"></div>
    <div class="mb-2"><label class="form-label">Similar contracts</label><input name="similar_contracts_count" type="number" class="form-control" value="2"></div>
    <div class="mb-2"><label class="form-label">NAFDAC status</label><input name="nafdac_status" class="form-control" placeholder="valid"></div>
    <div class="mb-2"><label class="form-label">Tax clearance</label><input name="tax_clearance" class="form-control"></div>
    <div class="mb-2"><label class="form-label">Logistics footprint</label><textarea name="logistics_footprint" class="form-control" rows="2"></textarea></div>
    <div class="mb-2"><label class="form-label">Address</label><input name="address" class="form-control"></div>
    <div class="mb-2"><label class="form-label">Email</label><input name="contact_email" type="email" class="form-control"></div>
    <button class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
