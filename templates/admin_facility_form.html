{% extends "base.html" %}
{% block title %}{{ 'Edit' if facility else 'Add' }} service unit{% endblock %}
{% block content %}
<div class="container py-3" style="max-width:720px">
  <h2 class="mb-3">{{ 'Edit service unit' if facility else 'Add kiosk / PHC / service unit' }}</h2>
  <form method="post" class="card card-body shadow-sm">
    <div class="mb-3">
      <label class="form-label">Name *</label>
      <input name="name" class="form-control" required value="{{ facility.name if facility else '' }}" placeholder="e.g. Central Market Kiosk">
    </div>
    <div class="mb-3">
      <label class="form-label">Type *</label>
      <select name="facility_type" class="form-select" required>
        {% set t = facility.facility_type if facility else 'kiosk' %}
        <option value="kiosk" {% if t=='kiosk' %}selected{% endif %}>Mobile / Community Kiosk</option>
        <option value="phc" {% if t=='phc' %}selected{% endif %}>Primary Health Centre (PHC)</option>
        <option value="mobile_unit" {% if t=='mobile_unit' %}selected{% endif %}>Mobile service unit</option>
        <option value="warehouse" {% if t=='warehouse' %}selected{% endif %}>Central store / warehouse</option>
        <option value="other" {% if t=='other' %}selected{% endif %}>Other service point</option>
      </select>
    </div>
    <div class="row g-2">
      <div class="col-md-8 mb-3">
        <label class="form-label">Address</label>
        <input name="address" class="form-control" value="{{ facility.address if facility else '' }}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">City</label>
        <input name="city" class="form-control" value="{{ facility.city if facility else 'Benin City' }}">
      </div>
    </div>
    <div class="row g-2">
      <div class="col-md-6 mb-3">
        <label class="form-label">Contact person</label>
        <input name="contact_person" class="form-control" value="{{ facility.contact_person if facility else '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>
        <input name="phone" class="form-control" value="{{ facility.phone if facility else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Target clients / month</label>
      <input name="target_clients_monthly" type="number" min="0" class="form-control" value="{{ facility.target_clients_monthly if facility else 100 }}">
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="is_active" value="1" id="is_active"
             {% if not facility or facility.is_active %}checked{% endif %}>
      <label class="form-check-label" for="is_active">Active (can receive stock and submit requests)</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">{{ 'Save changes' if facility else 'Create service unit' }}</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('admin_facilities') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
